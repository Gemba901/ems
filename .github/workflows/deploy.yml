name: Deploy Gemba EMS

on:
  push:
    branches:
      - main
      - staging

jobs:
  build-and-push-api:
    name: Build and Push API Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: vars
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=staging-latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and Push API Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ steps.vars.outputs.tag }}
        run: |
          docker build -f apps/api/Dockerfile \
            -t $ECR_REGISTRY/gemba-api:${{ github.sha }} \
            -t $ECR_REGISTRY/gemba-api:$IMAGE_TAG .
          docker push $ECR_REGISTRY/gemba-api:${{ github.sha }}
          docker push $ECR_REGISTRY/gemba-api:$IMAGE_TAG

  deploy-api-prod:
    name: Deploy API to EC2 (production)
    runs-on: ubuntu-latest
    needs: build-and-push-api
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy API container
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.API_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$ECR_REGISTRY/gemba-api:latest"
            docker stop gemba-api || true
            docker rm gemba-api || true
            docker run -d \
              --name gemba-api \
              --restart unless-stopped \
              -p 5000:5000 \
              --env-file /home/ubuntu/.env \
              "$ECR_REGISTRY/gemba-api:latest"
            docker image prune -f

  deploy-api-staging:
    name: Deploy API to EC2 (staging)
    runs-on: ubuntu-latest
    needs: build-and-push-api
    if: github.ref == 'refs/heads/staging'

    steps:
      - name: Deploy API container
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.API_EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: AWS_REGION,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY
          script: |
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ECR_REGISTRY="${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$ECR_REGISTRY"
            docker pull "$ECR_REGISTRY/gemba-api:staging-latest"
            docker stop gemba-api-staging || true
            docker rm gemba-api-staging || true
            docker run -d \
              --name gemba-api-staging \
              --restart unless-stopped \
              -p 5001:5000 \
              --env-file /home/ubuntu/.env.staging \
              "$ECR_REGISTRY/gemba-api:staging-latest"
            docker image prune -f
