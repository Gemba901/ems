# Local development stack: Postgres + API + web, with hot reload.
# Production images are apps/*/Dockerfile; this file is not used in deploys.
#
#   docker compose up            # first run installs deps, builds db, migrates, seeds
#   docker compose run --rm setup  # re-run after lockfile or schema changes
#
# On Linux, if `id -u` is not 1000, put DEV_UID/DEV_GID in a root .env file
# (see README) and run `docker compose build`.
#   docker compose down -v       # wipe the local database and node_modules
name: gemba-ems

x-node: &node
  build:
    context: .
    dockerfile: Dockerfile.dev
    args:
      DEV_UID: ${DEV_UID:-1000}
      DEV_GID: ${DEV_GID:-1000}
  image: gemba-ems-dev
  working_dir: /app
  volumes:
    - .:/app
    # Keep container node_modules and build output off the host checkout.
    - root_modules:/app/node_modules
    - api_modules:/app/apps/api/node_modules
    - web_modules:/app/apps/web/node_modules
    - db_modules:/app/packages/db/node_modules
    - web_next:/app/apps/web/.next
    - pnpm_store:/pnpm-store

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gemba
      POSTGRES_PASSWORD: gemba
      POSTGRES_DB: gemba_dev
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gemba -d gemba_dev"]
      interval: 2s
      timeout: 5s
      retries: 30

  setup:
    <<: *node
    command: >
      sh -c "pnpm install --frozen-lockfile
      && pnpm --filter db build
      && pnpm --filter db exec prisma migrate deploy
      && pnpm --filter db exec prisma db execute --file prisma/dev-seed.sql"
    environment:
      # Set explicitly so packages/db/.env (which may point at RDS) is never used.
      DATABASE_URL: postgresql://gemba:gemba@postgres:5432/gemba_dev
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *node
    command: pnpm --filter api dev
    # Defaults from .env.example, overridden by your apps/api/.env if present;
    # `environment` below overrides both with the values Docker needs.
    env_file:
      - apps/api/.env.example
      - path: apps/api/.env
        required: false
    environment:
      DATABASE_URL: postgresql://gemba:gemba@postgres:5432/gemba_dev
      EXPECTED_DATABASE_NAME: gemba_dev
      PORT: "5000"
      # nest --watch type-checks the whole API and exceeds Node's default heap.
      NODE_OPTIONS: --max-old-space-size=3072
    ports:
      - "5000:5000"
    depends_on:
      setup:
        condition: service_completed_successfully

  web:
    <<: *node
    command: pnpm --filter web exec next dev -H 0.0.0.0 -p 3000
    env_file:
      - apps/web/.env.example
      - path: apps/web/.env.local
        required: false
    environment:
      API_INTERNAL_URL: http://api:5000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  root_modules:
  api_modules:
  web_modules:
  db_modules:
  web_next:
  pnpm_store:
